<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人收支 / 分期 桑基图看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1>收支 / 分期 桑基图看板</h1>
        <p class="tagline">录入每月收支与借贷 · 生成单月 / 整体桑基图</p>
      </div>
      <div class="ledger-bar">
        <label for="ledgerSelect">账单</label>
        <div id="ledgerSelect"></div>
        <button id="btnNewLedger" class="btn">＋ 新建</button>
        <button id="btnRenameLedger" class="btn">重命名</button>
        <button id="btnDeleteLedger" class="btn">删除</button>
        <span id="saveState" class="save-state"></span>
      </div>
      <div class="topbar-actions">
        <button id="btnAdd" class="btn btn-primary">＋ 新增项目</button>
        <button id="btnSeed" class="btn">载入示例</button>
        <button id="btnExportCsv" class="btn">导出 CSV</button>
        <button id="btnExportSqlite" class="btn">导出 .sqlite</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">项目列表<span id="itemCount" class="count">0</span></div>
        <div id="itemList" class="item-list"></div>
        <div id="itemEmpty" class="muted pad">还没有项目。点右上角「新增项目」，或「载入示例」看看效果。</div>
      </aside>

      <main class="main">
        <nav class="tabs">
          <button class="tab active" data-tab="sankey">桑基图</button>
          <button class="tab" data-tab="calendar">日历</button>
          <button class="tab" data-tab="table">表格</button>
        </nav>

        <!-- 桑基图视图 -->
        <section id="view-sankey" class="view">
          <div class="metric-row" id="metricRow"></div>
          <div class="control-row">
            <div class="field" id="periodFields">
              <label>起</label><div id="periodStart"></div>
              <span class="sep">→</span>
              <label>止</label><div id="periodEnd"></div>
            </div>
            <button id="btnThisMonth" class="btn">本月</button>
            <button id="btnThisYear" class="btn">今年</button>
            <button id="btnExportPng" class="btn">导出图 PNG</button>
          </div>
          <div id="sankeyTitle" class="chart-title"></div>
          <div class="chart-wrap">
            <div id="sankeyChart" class="chart"></div>
            <div id="sankeyEmpty" class="chart-empty" hidden>当前没有项目 / 该区间没有数据<br /><span>点击右上角「新增项目」或「载入示例」开始</span></div>
            <div id="sankeyTip" class="sankey-tip" hidden></div>
          </div>
        </section>

        <!-- 日历视图 -->
        <section id="view-calendar" class="view" hidden>
          <div class="control-row">
            <button id="calPrev" class="btn">◀ 上月</button>
            <div id="calMonth"></div>
            <button id="calNext" class="btn">下月 ▶</button>
            <button id="calToday" class="btn btn-ghost">今天</button>
          </div>
          <div class="calendar-wrap">
            <div id="calWeekHeader" class="cal-week-header"></div>
            <div id="calGrid" class="cal-grid"></div>
          </div>
          <div id="dayDetail" class="day-detail"></div>
        </section>

        <!-- 表格视图：直接编辑 SQLite 行 -->
        <section id="view-table" class="view" hidden>
          <div id="tableWrap" class="table-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- 项目编辑弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">新增项目</h2>
        <button class="btn btn-close" id="modalClose">×</button>
      </div>
      <form id="itemForm" class="modal-body">
        <div class="grid-2">
          <div class="field"><label>名称</label><input id="fName" placeholder="如：房租" required /></div>
          <div class="field"><label>金额 (¥)</label><input id="fAmount" type="number" min="0" step="0.01" placeholder="3000" required /></div>
          <div class="field"><label>类型</label>
            <div id="fKind"></div>
          </div>
          <div class="field"><label>分类</label>
            <input id="fCategory" list="catList" placeholder="如：固定开销" />
            <datalist id="catList"></datalist>
          </div>
        </div>

        <div class="field"><label>排期方式</label>
          <div id="fSched"></div>
        </div>

        <div class="grid-2" id="schedRecurring">
          <div class="field"><label>开始日期</label><div id="fStart"></div></div>
          <div class="field"><label>结束日期（留空 = 永不结束）</label><div id="fEnd"></div></div>
          <div class="field"><label>每月几号 (1–31)</label><input id="fDay" type="number" min="1" max="31" placeholder="1" /></div>
        </div>

        <div class="field" id="schedOneoff" hidden><label>日期</label><div id="fDate"></div></div>
        <div class="field" id="schedMonthly" hidden><label>归属月份</label><div id="fMonth"></div></div>
        <div id="fPeriodHint" class="period-hint" hidden></div>

        <div class="field"><label>备注</label><input id="fNote" placeholder="选填" /></div>
        <label class="checkbox"><input id="fEnabled" type="checkbox" checked /> 启用该项目</label>

        <div class="modal-footer">
          <button type="button" class="btn" id="btnCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="mdDialogHost" hidden></div>

  <script src="app.js?v=13"></script>
</body>
</html>
